const opts={level:['PAUD / TK','MI / SD','MTs / SMP','MA / SMA / SMK / MAK','Perguruan Tinggi','Pendidikan Nonformal / Profesional'],curriculum:['Kurikulum Merdeka','Kurikulum Nasional lainnya','Cambridge International','International Baccalaureate (IB)','Pearson Edexcel','Australian Curriculum','Custom / Institution-specific'],purpose:['Diagnostik','Formatif','Sumatif','Penempatan','Remedial','Pengayaan','Kinerja / Praktik','Sertifikasi'],type:['Pilihan ganda (4 opsi)','Pilihan ganda kompleks','Benar / salah','Menjodohkan','Mengurutkan','Isian / cloze test','Jawaban singkat','Esai / uraian','Berbasis kasus / stimulus','Interpretasi grafik / tabel / peta','Speaking / Listening / Reading / Writing','Praktik / proyek / portofolio'],difficulty:['Mudah','Sedang','Sulit','Sangat sulit'],bloom:['C1 — Remember','C2 — Understand','C3 — Apply','C4 — Analyze','C5 — Evaluate','C6 — Create'],solo:['Level 1 — Prestructural','Level 2 — Unistructural','Level 3 — Multistructural','Level 4 — Relational','Level 5 — Extended Abstract'],demand:['LOTS','HOTS','Campuran'],lang:['Bahasa Indonesia','English']};function selectOptions(arr){return arr.map((x,i)=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}function field(label,name,control,wide=false){return `<div class="field ${wide?'wide':''}"><label for="${name}">${esc(label)}</label>${control}</div>`}function input(name,placeholder='',value='',type='text'){return `<input id="${name}" name="${name}" type="${type}" placeholder="${esc(placeholder)}" value="${esc(value)}">`}function select(name,arr,first=''){return `<select id="${name}" name="${name}">${first?`<option value="">${esc(first)}</option>`:''}${selectOptions(arr)}</select>`}
function builder(){return `${pageHead('assessmentBuilder',state.config.lang==='id'?'Atur metadata, tujuan, dan parameter generasi soal.':'Configure metadata, objectives, and question generation settings.')}<form id="builderForm"><div class="card"><div class="section-title"><h2>01 · ${esc(t('metadata'))}</h2><span class="pill">STEP 1 / 3</span></div><div class="form-grid">${field(t('title'),'aTitle',input('aTitle','Contoh: Asesmen Narrative Text'))}${field(t('level'),'aLevel',select('aLevel',opts.level))}${field(t('curriculum'),'aCurriculum',select('aCurriculum',opts.curriculum))}${field(t('grade'),'aGrade',input('aGrade','Kelas VIII / Semester 1'))}${field(t('phase'),'aPhase',input('aPhase','Fase D / Grade 8'))}${field(t('subject'),'aSubject',input('aSubject','Bahasa Inggris'))}${field(t('topic'),'aTopic',input('aTopic','Narrative Text'))}${field(t('language'),'aLang',select('aLang',opts.lang))}${field(t('purpose'),'aPurpose',select('aPurpose',opts.purpose))}${field(t('count'),'aCount',input('aCount','10','10','number'))}${field(t('duration'),'aDuration',input('aDuration','40','40','number'))}${field(t('questionType'),'aType',select('aType',opts.type))}${field(t('difficulty'),'aDifficulty',select('aDifficulty',opts.difficulty))}${field(t('bloom'),'aBloom',select('aBloom',opts.bloom))}${field(t('solo'),'aSolo',select('aSolo',opts.solo))}${field(t('demand'),'aDemand',select('aDemand',opts.demand))}${field(t('options'),'aOptions',select('aOptions',['3','4','5','6']))}${field(t('objective'),'aObjective',`<textarea id="aObjective" placeholder="Students analyze the structure and meaning of a narrative text…"></textarea>`,true)}${field(t('stimulus'),'aStimulus',`<textarea id="aStimulus" placeholder="${esc(t('stimulusHelp'))}"></textarea><div class="notice">${esc(t('stimulusHelp'))}</div>`,true)}</div><div class="divider"></div><div class="toolbar"><button class="btn primary" type="submit">✦ ${esc(t('generate'))}</button><button class="btn" type="button" id="previewPromptBtn">⌘ ${esc(t('generatePrompt'))}</button><button class="btn" type="reset">${esc(t('cancel'))}</button></div><div class="notice">Generator prototipe memakai pola soal berbasis template. Untuk kualitas AI generatif penuh, hubungkan penyedia AI melalui backend yang aman.</div></div></form><section id="generatedPanel" class="card section hidden"><div class="section-title"><h2>${esc(t('generated'))}</h2><div class="toolbar"><button class="btn sm" id="exportCurrent">⇩ ${esc(t('download'))}</button><button class="btn sm" id="saveAsApproved">✓ Mark reviewed</button></div></div><div id="generatedList"></div></section>`}
function getForm(){const val=id=>($('#'+id)?.value||'').trim();return {title:val('aTitle')||'Untitled Assessment',level:val('aLevel'),curriculum:val('aCurriculum'),grade:val('aGrade'),phase:val('aPhase'),subject:val('aSubject')||'General',topic:val('aTopic')||'General Topic',language:val('aLang')||'Bahasa Indonesia',purpose:val('aPurpose'),count:Math.max(1,Math.min(100,Number(val('aCount'))||10)),duration:Number(val('aDuration'))||40,type:val('aType'),difficulty:val('aDifficulty'),bloom:val('aBloom'),solo:val('aSolo'),demand:val('aDemand'),optionCount:Number(val('aOptions'))||4,objective:val('aObjective'),stimulus:val('aStimulus')}}
function promptFor(c){return `ROLE\nAct as an expert educational assessment designer, curriculum specialist, and psychometric reviewer.\n\nASSESSMENT METADATA\nTitle: ${c.title}\nLevel: ${c.level}; Grade: ${c.grade}; Phase: ${c.phase}\nCurriculum: ${c.curriculum}\nSubject: ${c.subject}; Topic: ${c.topic}\nQuestion language: ${c.language}\nPurpose: ${c.purpose}; Duration: ${c.duration} minutes\nQuestion count: ${c.count}; Type: ${c.type}\nDifficulty: ${c.difficulty}; Bloom: ${c.bloom}; SOLO: ${c.solo}; Cognitive demand: ${c.demand}\nLearning objective/indicator: ${c.objective}\nStimulus: ${c.stimulus||'(Create or omit as educationally appropriate)'}\n\nQUALITY RULES\n1. Generate exactly ${c.count} questions and align each to the stated learning objective.\n2. Use age-appropriate language and valid curriculum references. Do not fabricate official standards or citations.\n3. For MCQs, use ${c.optionCount} options, plausible distractors, no duplicate choices, and relatively similar option lengths where appropriate.\n4. Verify answer-key integrity and provide a concise explanation for each item.\n5. Tag each item with Bloom, SOLO, difficulty, LOTS/HOTS, and objective mapping. Explain uncertain mappings.\n6. Detect repeated wording and near-duplicate items.\n7. One shared stimulus/dialogue/passage may support no more than five questions. Create separate stimulus groups when needed.\n8. Distinguish verified source facts from generated examples. Flag anything requiring human review.\n9. Output structured JSON with metadata, stimuli, questions, options, answer keys, explanations, taxonomy mappings, validation warnings, and source references.\n10. Do not claim human review or official compliance unless actually verified.\n\nBefore finalizing, run a consistency check on question count, answer keys, option count, source support, taxonomy alignment, and the five-item stimulus limit.`}
function buildPromptPage(){return `${pageHead('promptTitle',t('promptDesc'))}<div class="grid split"><section class="card"><h2>01 · ${esc(t('metadata'))}</h2><div class="form-grid">${field(t('title'),'pTitle',input('pTitle','Assessment title','Assessment Blueprint'))}${field(t('level'),'pLevel',select('pLevel',opts.level))}${field(t('curriculum'),'pCurriculum',select('pCurriculum',opts.curriculum))}${field(t('subject'),'pSubject',input('pSubject','English'))}${field(t('topic'),'pTopic',input('pTopic','Narrative Text'))}${field(t('count'),'pCount',input('pCount','10','10','number'))}${field(t('objective'),'pObjective',`<textarea id="pObjective" placeholder="Learning objective / indicator"></textarea>`,true)}<div class="toolbar"><button class="btn primary" id="makePromptBtn" type="button">✦ ${esc(t('generatePrompt'))}</button></div></div></section><section class="card"><div class="section-title"><h2>${esc(t('previewPrompt'))}</h2><div class="toolbar"><button class="btn sm" id="copyPrompt">${esc(t('copy'))}</button><button class="btn sm" id="downloadPrompt">⇩ TXT</button></div></div><textarea id="promptOutput" style="min-height:500px;font-family:ui-monospace,monospace;font-size:12px" placeholder="Generated prompt will appear here…">${esc(state.lastPrompt||'')}</textarea><div class="notice">Prompt is a reusable instruction. It does not itself call an AI provider.</div></section></div>`}
function blueprint(){const items=state.questions;return `${pageHead('blueprintTitle',t('blueprintDesc'))}<div class="grid stats"><div class="card"><div class="muted small">Questions mapped</div><div class="stat"><div class="number">${items.length}</div><span class="stat-icon">▤</span></div></div><div class="card"><div class="muted small">Bloom coverage</div><div class="stat"><div class="number">${new Set(items.map(q=>q.bloom)).size}/6</div><span class="stat-icon">✦</span></div></div><div class="card"><div class="muted small">SOLO coverage</div><div class="stat"><div class="number">${new Set(items.map(q=>q.solo)).size}/5</div><span class="stat-icon">◈</span></div></div><div class="card"><div class="muted small">Stimulus groups</div><div class="stat"><div class="number">${new Set(items.map(q=>q.stimulusId).filter(Boolean)).size}</div><span class="stat-icon">▧</span></div></div></div><div class="card"><div class="section-title"><h2>Blueprint item map</h2><button class="btn sm" id="blueprintCSV">⇩ Export CSV</button></div>${items.length?`<div class="table-wrap"><table><thead><tr><th>ID</th><th>Topic / question</th><th>Objective</th><th>Bloom</th><th>SOLO</th><th>Difficulty</th><th>Stimulus group</th></tr></thead><tbody>${items.map(q=>`<tr><td>${esc(q.id)}</td><td>${esc(q.text.slice(0,100))}</td><td>${esc(q.objective)}</td><td>${esc(q.bloom)}</td><td>${esc(q.solo)}</td><td>${esc(q.difficulty)}</td><td>${esc(q.stimulusId||'—')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Belum ada item. Buat asesmen untuk membangun blueprint.</div>`}</div>`}
function mediaPage(){return `${pageHead('mediaTitle',t('mediaDesc'))}<div class="callout">ⓘ ${esc(t('mediaWarning'))}</div><div class="grid split"><section class="card"><h2>Media specification builder</h2><form id="mediaForm"><div class="form-grid">${field(t('mediaName'),'mName',input('mName','Ecosystem food web'))}${field(t('mediaType'),'mType',select('mType',['Image / illustration','Graph / chart','Diagram / concept map','Infographic','Map / location','Table / data visualization','Painting / artwork','Qur’an / Hadith reference']))}${field('Target level','mLevel',select('mLevel',opts.level))}${field(t('description'),'mDesc',`<textarea id="mDesc" placeholder="Describe the visual, learning purpose, labels, and composition…"></textarea>`,true)}${field(t('dataSource'),'mSource',input('mSource','Source URL, dataset, or citation'),true)}</div><div class="toolbar section"><button class="btn primary" type="submit">＋ ${esc(t('saveSpec'))}</button></div></form></section><section class="card"><h2>Media library</h2>${state.media.length?state.media.map(m=>`<div class="list-row"><div><b>${esc(m.name)}</b><div class="muted small">${esc(m.type)} · ${fmtDate(m.createdAt)}</div><div class="small">${esc(m.description)}</div><div class="muted small">Source: ${esc(m.source||'Not provided')}</div></div><button class="btn sm danger" data-delete-media="${esc(m.id)}">${esc(t('delete'))}</button></div>`).join(''):`<div class="empty">No media specifications saved.</div>`}</section></div>`}
function importPage(){return `${pageHead('importTitle',t('importDesc'))}<section class="card"><div class="file-drop"><div style="font-size:28px;margin-bottom:8px">⇧</div><h2>${esc(t('dropFiles'))}</h2><div class="muted small">${esc(t('supported'))}</div><label class="btn primary" for="importFile" style="margin-top:16px">${esc(t('chooseFile'))}</label><input type="file" id="importFile" multiple accept=".txt,.csv,.json,.md,.html,.xml,.log,.tsv,text/plain,text/csv,application/json,text/markdown,text/html"></div><div class="notice">Berkas diproses di browser prototipe ini. Jangan unggah informasi pribadi atau dokumen rahasia.</div></section><section class="card section"><div class="section-title"><h2>Import jobs</h2><span class="pill">${state.imports.length} files</span></div>${state.imports.length?state.imports.map(f=>`<div class="list-row"><div><b>${esc(f.name)}</b><div class="muted small">${fmtDate(f.createdAt)} · ${f.size} bytes · ${esc(f.status)}</div><div class="small">${esc(f.preview||'No text preview')}</div></div><div class="toolbar"><button class="btn sm" data-use-import="${esc(f.id)}">Use as stimulus</button><button class="btn sm danger" data-delete-import="${esc(f.id)}">${esc(t('delete'))}</button></div></div>`).join(''):`<div class="empty">No imported files yet.</div>`}</section>`}
function questionCard(q,idx){return `<article class="question"><div class="question-top"><div class="tag-row"><span class="pill">Q${idx+1}</span><span class="mini-tag">${esc(q.bloom)}</span><span class="mini-tag">${esc(q.solo)}</span><span class="mini-tag">${esc(q.difficulty)}</span>${q.status==='approved'?'<span class="pill good">Reviewed</span>':'<span class="pill warn">Draft</span>'}</div><button class="btn sm danger no-print" data-delete-question="${esc(q.id)}">${esc(t('delete'))}</button></div><div style="font-weight:700;margin:8px 0">${esc(q.text)}</div>${q.options?.length?q.options.map((o,i)=>`<div class="option ${i===q.correctIndex?'correct':''}"><span>${String.fromCharCode(65+i)}.</span><span>${esc(o)}</span>${i===q.correctIndex?`<span class="pill good">${esc(t('correct'))}</span>`:''}</div>`).join(''):''}<div class="divider"></div><div class="small"><b>${esc(t('answerKey'))}:</b> ${esc(q.options?.[q.correctIndex]||q.answer||'Use rubric / scoring criteria')}</div><div class="small" style="margin-top:5px"><b>${esc(t('explanation'))}:</b> ${esc(q.explanation||'Review required.')}</div><div class="tag-row" style="margin-top:10px"><span class="mini-tag">Objective: ${esc(q.objective)}</span><span class="mini-tag">${esc(q.stimulusId||t('noStimulus'))}</span><span class="mini-tag">${esc(q.subject)}</span></div></article>`}
function bankPage(){const qs=state.questions;return `${pageHead('bankTitle',t('bankDesc'),`<button class="btn" data-goto="export">⇩ Export</button>`)}<div class="card"><div class="toolbar" style="justify-content:space-between;margin-bottom:14px"><input id="bankSearch" placeholder="${esc(t('search'))}" aria-label="Search questions"><span class="pill">${qs.length} questions</span></div><div id="bankList">${qs.length?qs.map(questionCard).join(''):`<div class="empty"><div class="big">▣</div>${esc(t('noQuestions'))}</div>`}</div></div>`}
function historyPage(){return `${pageHead('historyTitle',t('historyDesc'))}<div class="card"><div class="toolbar" style="justify-content:space-between;margin-bottom:12px"><input id="historySearch" placeholder="${esc(t('search'))}"><button class="btn" id="historyBackup">⇩ JSON backup</button></div>${state.history.length?`<div class="table-wrap"><table><thead><tr><th>Assessment</th><th>Subject / topic</th><th>Questions</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead><tbody id="historyRows">${historyRows(state.history)}</tbody></table></div>`:`<div class="empty"><div class="big">◷</div>${esc(t('noHistory'))}</div>`}</div>`}function historyRows(rows){return rows.map(h=>`<tr><td><b>${esc(h.title)}</b><div class="muted small">${esc(h.id)}</div></td><td>${esc(h.subject)}<div class="muted small">${esc(h.topic)}</div></td><td>${h.count}</td><td>${fmtDate(h.createdAt)}</td><td><span class="pill">${esc(h.status||'Draft')}</span></td><td><div class="toolbar"><button class="btn sm" data-open-history="${esc(h.id)}">Open</button><button class="btn sm" data-export-history="${esc(h.id)}">TXT</button><button class="btn sm danger" data-delete-history="${esc(h.id)}">×</button></div></td></tr>`).join('')}
function qaPage(){const q=state.questions;const checks=[];q.forEach(x=>{if(!x.text||x.text.length<12)checks.push({id:x.id,title:'Question text may be too short',detail:x.text});if(x.options?.length&&(!Number.isInteger(x.correctIndex)||!x.options[x.correctIndex]))checks.push({id:x.id,title:'Missing or invalid answer key',detail:x.text});if(x.options?.length&&new Set(x.options.map(s=>s.trim().toLowerCase())).size!==x.options.length)checks.push({id:x.id,title:'Duplicate options detected',detail:x.text});if(x.stimulusId&&state.questions.filter(z=>z.stimulusId===x.stimulusId).length>5)checks.push({id:x.id,title:'Stimulus group exceeds five questions',detail:x.stimulusId});if(x.objective==='Not specified')checks.push({id:x.id,title:'Objective mapping needs review',detail:x.text})});const duplicates=[];for(let i=0;i<q.length;i++)for(let j=i+1;j<q.length;j++){const a=norm(q[i].text),b=norm(q[j].text);if(a&&b&&(a===b||similarity(a,b)>.82))duplicates.push({a:q[i],b:q[j],score:Math.round(similarity(a,b)*100)})}return `${pageHead('qaTitle',t('qaDesc'))}<div class="grid stats"><div class="card"><div class="muted small">Items checked</div><div class="number">${q.length}</div></div><div class="card"><div class="muted small">Warnings</div><div class="number">${checks.length}</div></div><div class="card"><div class="muted small">Duplicate candidates</div><div class="number">${duplicates.length}</div></div><div class="card"><div class="muted small">Reviewed items</div><div class="number">${q.filter(x=>x.status==='approved').length}</div></div></div><section class="card"><h2>Automated validation results</h2>${checks.length?checks.map(c=>`<div class="list-row"><div><b>${esc(c.title)}</b><div class="muted small">${esc(c.detail)}</div><div class="muted small">ID: ${esc(c.id)}</div></div><span class="pill warn">${esc(t('warning'))}</span></div>`).join(''):`<div class="empty">✓ ${esc(t('noWarnings'))}</div>`}</section><section class="card section"><h2>${esc(t('duplicate'))}</h2>${duplicates.length?duplicates.map(d=>`<div class="list-row"><div><b>${esc(d.a.text.slice(0,100))}</b><div class="muted small">Compared with: ${esc(d.b.text.slice(0,100))}</div></div><span class="pill warn">${d.score}%</span></div>`).join(''):`<div class="empty">No similar question candidates detected.</div>`}</section><div class="callout">Automated text similarity is only a screening aid. Subject experts must verify correctness, validity, fairness, curriculum alignment, and source integrity.</div>`}
function exportPage(){return `${pageHead('exportTitle',t('exportDesc'))}<div class="grid quick-grid"><div class="card"><div class="stat-icon">TXT</div><h2 style="margin-top:14px">Plain text</h2><p class="muted">Export questions, answer keys, explanations, and metadata.</p><button class="btn primary" data-export-all="txt">${esc(t('exportQuestions'))}</button></div><div class="card"><div class="stat-icon">CSV</div><h2 style="margin-top:14px">Spreadsheet CSV</h2><p class="muted">Structured data that can be opened in Excel or other spreadsheet tools.</p><button class="btn primary" data-export-all="csv">${esc(t('exportCSV'))}</button></div><div class="card"><div class="stat-icon">PDF</div><h2 style="margin-top:14px">Print / PDF</h2><p class="muted">Open the browser print dialog and choose Save as PDF.</p><button class="btn primary" id="printBtn">${esc(t('printPDF'))}</button></div><div class="card"><div class="stat-icon">JSON</div><h2 style="margin-top:14px">Backup & restore</h2><p class="muted">Export your local workspace data or restore it on this browser.</p><div class="toolbar"><button class="btn" id="backupBtn">Download JSON</button><label class="btn" for="restoreFile">Restore JSON</label><input id="restoreFile" type="file" accept="application/json" class="hidden"></div></div></div><div class="callout">DOCX/PDF/XLSX binary generation is not included in this single-file prototype. CSV is spreadsheet-compatible; print-to-PDF uses your browser. A production deployment should add a DOCX/PDF/XLSX export service and validate the resulting files.</div>`}
function settingsPage(){return `${pageHead('settingsTitle',t('settingsDesc'))}<div class="grid split"><section class="card"><h2>${esc(t('settingsTitle'))}</h2><div class="field"><label>${esc(t('languageSetting'))}</label><select id="settingsLang"><option value="id">Bahasa Indonesia</option><option value="en">English</option></select></div><div class="field section"><label>${esc(t('themeSetting'))}</label><select id="settingsTheme"><option value="light">${esc(t('themeLight'))}</option><option value="dark">${esc(t('themeDark'))}</option></select></div><button class="btn primary section" id="savePrefs">${esc(t('saveSettings'))}</button><div class="divider"></div><h2>${esc(t('about'))}</h2><p class="muted">EDUQUEST AI — Enterprise Assessment Studio</p><p>Created by <b>Ahmad Budi Leksono</b></p><span class="pill">Prototype v0.1</span></section><section class="card"><h2>${esc(t('dataManagement'))}</h2><p class="muted small">${esc(t('localOnly'))}. Data tidak otomatis tersinkron ke perangkat lain.</p><div class="list-row"><div><b>${esc(t('downloadBackup'))}</b><div class="muted small">Assessments, questions, history, imports, media, preferences.</div></div><button class="btn" id="backupBtn2">Download</button></div><div class="list-row"><div><b>${esc(t('restoreBackup'))}</b><div class="muted small">Restore a previously downloaded EDUQUEST JSON backup.</div></div><label class="btn" for="restoreFile2">Choose JSON</label><input id="restoreFile2" type="file" accept="application/json" class="hidden"></div><div class="list-row"><div><b>${esc(t('clearData'))}</b><div class="muted small">This action cannot be undone without a backup.</div></div><button class="btn danger" id="clearData">${esc(t('delete'))}</button></div></section></div>`}
function render(){applyPrefs();const c=$('#content');const fn={dashboard,builder,prompt:buildPromptPage,blueprint,media:mediaPage,import:importPage,bank:bankPage,history:historyPage,qa:qaPage,export:exportPage,settings:settingsPage};c.innerHTML=(fn[currentPage]||dashboard)();bindPage();}
function norm(s){return (s||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}function similarity(a,b){if(a===b)return 1;const aa=new Set(a.split(' ')),bb=new Set(b.split(' '));const inter=[...aa].filter(x=>bb.has(x)).length;return inter/Math.max(1,new Set([...aa,...bb]).size)}
function createQuestions(c){const isEn=c.language==='English',mcq=c.type.toLowerCase().includes('pilihan ganda')||c.type.toLowerCase().includes('multiple');const subject=c.subject,topic=c.topic,objective=c.objective||'Not specified';const stimulusId=c.stimulus?`ST-${Date.now().toString(36).toUpperCase()}`:null;const questions=[];for(let i=0;i<c.count;i++){let text,options=[],correctIndex=0,answer,explanation;const n=i+1;if(mcq){if(isEn){text=`[Draft ${n}] Which statement best demonstrates understanding of “${topic}” in ${subject}?`;options=[`It applies the key concept of ${topic} to the stated context`,`It repeats an unrelated detail without explaining the concept`,`It changes the topic and ignores the learning objective`,`It gives an unsupported conclusion unrelated to the evidence`];explanation=`The best answer directly applies the central concept of ${topic} to the context. Review and replace this template with subject-specific content before use.`}else{text=`[Draf ${n}] Pernyataan manakah yang paling tepat menunjukkan pemahaman tentang “${topic}” pada mata pelajaran ${subject}?`;options=[`Menerapkan konsep utama ${topic} pada konteks yang diberikan`,`Mengulang detail yang tidak relevan tanpa menjelaskan konsep`,`Mengubah topik dan mengabaikan tujuan pembelajaran`,`Memberikan kesimpulan tanpa dukungan bukti yang relevan`];explanation=`Jawaban terbaik menghubungkan konsep utama ${topic} dengan konteks. Tinjau dan ganti pola ini dengan isi spesifik mata pelajaran sebelum digunakan.`}correctIndex=0; // rotate options while preserving answer mapping
const rotate=n%options.length;options=options.slice(rotate).concat(options.slice(0,rotate));correctIndex=(options.indexOf(isEn?`It applies the key concept of ${topic} to the stated context`:`Menerapkan konsep utama ${topic} pada konteks yang diberikan`));
}else{ text=isEn?`[Draft ${n}] Explain or demonstrate one important idea about “${topic}” and relate it to the learning objective.`:`[Draf ${n}] Jelaskan atau tunjukkan satu gagasan penting tentang “${topic}” dan hubungkan dengan tujuan pembelajaran.`;answer=isEn?'A valid response should accurately explain the key concept and connect it to the learning objective.':'Jawaban yang baik menjelaskan konsep secara akurat dan menghubungkannya dengan tujuan pembelajaran.';explanation=isEn?'Use the rubric and objective to evaluate the response; alternative valid answers may be accepted.':'Gunakan rubrik dan tujuan pembelajaran untuk menilai respons; jawaban alternatif yang valid dapat diterima.'}
const q={id:id(),assessmentId:null,createdAt:new Date().toISOString(),text,options,correctIndex,answer,explanation,objective,subject,topic,bloom:c.bloom,solo:c.solo,difficulty:c.difficulty,demand:c.demand,type:c.type,stimulusId,status:'draft',source:'template-prototype'};questions.push(q)}return questions}
function handleBuilderSubmit(e){e.preventDefault();const c=getForm();if(!c.objective){toast(t('objectiveRequired'));$('#aObjective').focus();return}if(c.stimulus&&c.count>5){const ok=confirm('Satu stimulus hanya boleh mendukung maksimal 5 soal. Buat soal maksimal 5 untuk stimulus ini?');if(!ok)return;c.count=5;$('#aCount').value='5';toast('Jumlah disesuaikan menjadi 5 untuk mematuhi batas stimulus.')}const q=createQuestions(c);const assessmentId=id();q.forEach(x=>x.assessmentId=assessmentId);const a={id:assessmentId,...c,createdAt:new Date().toISOString(),count:q.length,status:'Draft'};state.assessments.unshift(a);state.questions.unshift(...q);const h={id:assessmentId,title:c.title,subject:c.subject,topic:c.topic,count:q.length,createdAt:a.createdAt,status:'Draft',questionIds:q.map(x=>x.id),config:c};state.history.unshift(h);lastGenerated=q;persist();$('#generatedPanel').classList.remove('hidden');$('#generatedList').innerHTML=q.map(questionCard).join('');$('#generatedPanel').scrollIntoView({behavior:'smooth',block:'start'});toast(t('generatedToast'));bindGenerated()}
function bindGenerated(){$$('#generatedList [data-delete-question]').forEach(b=>b.addEventListener('click',()=>deleteQuestion(b.dataset.deleteQuestion)));$('#exportCurrent')?.addEventListener('click',()=>downloadText(lastGenerated.map((q,i)=>formatQuestion(q,i)).join('\n\n'),'eduquest-questions.txt','text/plain'));$('#saveAsApproved')?.addEventListener('click',()=>{const ids=new Set(lastGenerated.map(q=>q.id));state.questions.forEach(q=>{if(ids.has(q.id))q.status='approved'});state.history.forEach(h=>{if(h.questionIds?.some(x=>ids.has(x)))h.status='Reviewed'});persist();$('#generatedList').innerHTML=lastGenerated.map(q=>({...q,status:'approved'})).map(questionCard).join('');toast('Marked as reviewed. Expert validation is still recommended.')})}
function formatQuestion(q,i){return `${i+1}. ${q.text}\n${(q.options||[]).map((o,j)=>`   ${String.fromCharCode(65+j)}. ${o}`).join('\n')}\nAnswer: ${q.options?.[q.correctIndex]||q.answer||'Use rubric'}\nExplanation: ${q.explanation}\nBloom: ${q.bloom} | SOLO: ${q.solo} | Difficulty: ${q.difficulty} | Demand: ${q.demand}\nObjective: ${q.objective}\nStimulus group: ${q.stimulusId||'None'}\nID: ${q.id}`}
function downloadText(text,name,type='text/plain'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function csvEscape(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function questionsCSV(qs){const headers=['id','assessmentId','text','options','correctAnswer','explanation','objective','subject','topic','bloom','solo','difficulty','demand','type','stimulusId','status'];return [headers.map(csvEscape).join(','),...qs.map(q=>[q.id,q.assessmentId,q.text,(q.options||[]).join(' | '),q.options?.[q.correctIndex]||q.answer,q.explanation,q.objective,q.subject,q.topic,q.bloom,q.solo,q.difficulty,q.demand,q.type,q.stimulusId,q.status].map(csvEscape).join(','))].join('\r\n')}
function exportHistory(hid){const h=state.history.find(x=>x.id===hid);if(!h)return;const qs=state.questions.filter(q=>h.questionIds?.includes(q.id));downloadText(qs.map(formatQuestion).join('\n\n'),'eduquest-'+slug(h.title)+'.txt')}
function slug(s){return (s||'assessment').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'assessment'}function backup(){downloadText(JSON.stringify(state,null,2),'eduquest-ai-backup.json','application/json')}
function restoreFile(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.questions)||!Array.isArray(d.history))throw Error('Invalid backup');if(!confirm('Replace current local workspace with backup data?'))return;state={...defaultState,...d,config:{...defaultState.config,...d.config}};persist();applyPrefs();navigate('dashboard');toast('Backup restored.')}catch(e){toast('Invalid or unsupported JSON backup.')}};r.readAsText(file)}
function bindPage(){const form=$('#builderForm');if(form)form.addEventListener('submit',handleBuilderSubmit);$('#previewPromptBtn')?.addEventListener('click',()=>{const c=getForm();state.lastPrompt=promptFor(c);persist();navigate('prompt');$('#promptOutput').value=state.lastPrompt;$('#pTitle').value=c.title;$('#pSubject').value=c.subject;$('#pTopic').value=c.topic;$('#pCount').value=c.count;$('#pObjective').value=c.objective;toast('Prompt preview generated.')});$('#makePromptBtn')?.addEventListener('click',()=>{const c={title:$('#pTitle').value||'Assessment',level:$('#pLevel').value,curriculum:$('#pCurriculum').value,grade:'Not specified',phase:'Not specified',subject:$('#pSubject').value||'General',topic:$('#pTopic').value||'General',language:'Bahasa Indonesia',purpose:'Assessment',duration:40,count:Math.max(1,Number($('#pCount').value)||10),type:'Multiple choice',difficulty:'Medium',bloom:'C4 — Analyze',solo:'Level 4 — Relational',demand:'HOTS',optionCount:4,objective:$('#pObjective').value,stimulus:''};state.lastPrompt=promptFor(c);persist();$('#promptOutput').value=state.lastPrompt;toast('Prompt created.')});$('#copyPrompt')?.addEventListener('click',()=>copyText($('#promptOutput').value));$('#downloadPrompt')?.addEventListener('click',()=>downloadText($('#promptOutput').value||state.lastPrompt,'eduquest-prompt.txt'));$('#mediaForm')?.addEventListener('submit',e=>{e.preventDefault();state.media.unshift({id:id(),name:$('#mName').value||'Untitled media',type:$('#mType').value,level:$('#mLevel').value,description:$('#mDesc').value,source:$('#mSource').value,createdAt:new Date().toISOString(),status:'Specification only'});persist();navigate('media');toast('Media specification saved; no image was generated.')});$$('[data-delete-media]').forEach(b=>b.addEventListener('click',()=>{if(confirm(t('confirmDelete'))){state.media=state.media.filter(m=>m.id!==b.dataset.deleteMedia);persist();render()}}));$('#importFile')?.addEventListener('change',e=>[...e.target.files].forEach(importOne));$$('[data-use-import]').forEach(b=>b.addEventListener('click',()=>{const f=state.imports.find(x=>x.id===b.dataset.useImport);if(!f)return;navigate('builder');$('#aStimulus').value=f.text||f.preview||'';$('#aTitle').value='Questions from '+f.name;toast('Imported text copied into the stimulus field.')}));$$('[data-delete-import]').forEach(b=>b.addEventListener('click',()=>{if(confirm(t('confirmDelete'))){state.imports=state.imports.filter(x=>x.id!==b.dataset.deleteImport);persist();render()}}));$('#bankSearch')?.addEventListener('input',e=>{const v=norm(e.target.value);const filtered=state.questions.filter(q=>norm([q.text,q.subject,q.topic,q.objective].join(' ')).includes(v));$('#bankList').innerHTML=filtered.length?filtered.map(questionCard).join():`<div class="empty">No matches.</div>`;bindQuestionDelete()});bindQuestionDelete();$('#historySearch')?.addEventListener('input',e=>{const v=norm(e.target.value);$('#historyRows').innerHTML=historyRows(state.history.filter(h=>norm([h.title,h.subject,h.topic].join(' ')).includes(v))) ;bindHistoryButtons()});$('#historyBackup')?.addEventListener('click',backup);bindHistoryButtons();$('#blueprintCSV')?.addEventListener('click',()=>downloadText(questionsCSV(state.questions),'eduquest-blueprint.csv','text/csv;charset=utf-8'));$$('[data-export-all]').forEach(b=>b.addEventListener('click',()=>exportAll(b.dataset.exportAll)));$('#printBtn')?.addEventListener('click',()=>window.print());$('#backupBtn')?.addEventListener('click',backup);$('#backupBtn2')?.addEventListener('click',backup);$('#restoreFile')?.addEventListener('change',e=>e.target.files[0]&&restoreFile(e.target.files[0]));$('#restoreFile2')?.addEventListener('change',e=>e.target.files[0]&&restoreFile(e.target.files[0]));$('#clearData')?.addEventListener('click',()=>{if(confirm('Delete all EDUQUEST AI local data? This cannot be undone.')){state=structuredClone(defaultState);persist();navigate('dashboard');toast('Local data cleared.')}});$('#savePrefs')?.addEventListener('click',()=>{state.config.lang=$('#settingsLang').value;state.config.theme=$('#settingsTheme').value;persist();applyPrefs();navigate(currentPage);toast('Preferences saved.')});if($('#settingsLang'))$('#settingsLang').value=state.config.lang;if($('#settingsTheme'))$('#settingsTheme').value=state.config.theme;$$('[data-delete-question]').forEach(b=>b.addEventListener('click',()=>deleteQuestion(b.dataset.deleteQuestion)));$$('[data-open-history]').forEach(b=>b.addEventListener('click',()=>{const h=state.history.find(x=>x.id===b.dataset.openHistory);if(h){navigate('bank');setTimeout(()=>{const qids=new Set(h.questionIds||[]);$('#bankList').innerHTML=state.questions.filter(q=>qids.has(q.id)).map(questionCard).join();bindQuestionDelete()},0)}}));$$('[data-export-history]').forEach(b=>b.addEventListener('click',()=>exportHistory(b.dataset.exportHistory)));$$('[data-delete-history]').forEach(b=>b.addEventListener('click',()=>{if(confirm(t('confirmDelete'))){const h=state.history.find(x=>x.id===b.dataset.deleteHistory);state.history=state.history.filter(x=>x.id!==b.dataset.deleteHistory);if(h){const set=new Set(h.questionIds||[]);state.questions=state.questions.filter(q=>!set.has(q.id));state.assessments=state.assessments.filter(a=>a.id!==h.id)}persist();render()}}));$$('[data-export-all]').forEach(b=>b.addEventListener('click',()=>exportAll(b.dataset.exportAll)))}
function bindQuestionDelete(){$$('[data-delete-question]').forEach(b=>b.onclick=()=>deleteQuestion(b.dataset.deleteQuestion))}function bindHistoryButtons(){$$('[data-open-history]').forEach(b=>b.onclick=()=>{const h=state.history.find(x=>x.id===b.dataset.openHistory);if(h){navigate('bank');setTimeout(()=>{const set=new Set(h.questionIds||[]);$('#bankList').innerHTML=state.questions.filter(q=>set.has(q.id)).map(questionCard).join();bindQuestionDelete()},0)}});$$('[data-export-history]').forEach(b=>b.onclick=()=>exportHistory(b.dataset.exportHistory));$$('[data-delete-history]').forEach(b=>b.onclick=()=>{if(confirm(t('confirmDelete'))){const h=state.history.find(x=>x.id===b.dataset.deleteHistory);state.history=state.history.filter(x=>x.id!==b.dataset.deleteHistory);if(h){const set=new Set(h.questionIds||[]);state.questions=state.questions.filter(q=>!set.has(q.id));state.assessments=state.assessments.filter(a=>a.id!==h.id)}persist();render()}})}function deleteQuestion(qid){if(!confirm(t('confirmDelete')))return;state.questions=state.questions.filter(q=>q.id!==qid);state.history.forEach(h=>{h.questionIds=(h.questionIds||[]).filter(x=>x!==qid);h.count=h.questionIds.length});persist();render();toast('Question deleted.')}
function exportAll(kind){if(!state.questions.length){toast(t('noData'));return}if(kind==='csv')downloadText(questionsCSV(state.questions),'eduquest-question-bank.csv','text/csv;charset=utf-8');else downloadText(state.questions.map(formatQuestion).join('\n\n'),'eduquest-question-bank.txt')}
function importOne(file){const ext=file.name.split('.').pop().toLowerCase();const allowed=['txt','csv','json','md','html','xml','log','tsv'];if(!allowed.includes(ext)){state.imports.unshift({id:id(),name:file.name,size:file.size,status:'Unsupported in prototype',createdAt:new Date().toISOString(),preview:'This file type requires an additional parser.',text:''});persist();render();toast(t('importFail'));return}const reader=new FileReader();reader.onload=()=>{const text=String(reader.result||'');state.imports.unshift({id:id(),name:file.name,size:file.size,status:'Text extracted',createdAt:new Date().toISOString(),preview:text.slice(0,260),text:text});persist();render();toast(t('importSuccess'))};reader.onerror=()=>toast(t('importFail'));reader.readAsText(file)}function copyText(text){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast(t('copied'))).catch(()=>fallbackCopy(text));else fallbackCopy(text)}function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(t('copied'))}catch(e){toast('Copy unavailable; select the text manually.')}ta.remove()}
document.addEventListener('click',e=>{const pageBtn=e.target.closest('[data-page]');if(pageBtn){navigate(pageBtn.dataset.page);return}const b=e.target.closest('[data-goto]');if(b)navigate(b.dataset.goto)});$('#languageSelect').addEventListener('change',e=>{state.config.lang=e.target.value;persist();applyPrefs();render()});$('#themeBtn').addEventListener('click',()=>{state.config.theme=state.config.theme==='dark'?'light':'dark';persist();applyPrefs()});$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$('#logoutBtn').addEventListener('click',()=>toast(t('logoutMsg')));render();
})();
</script></body></html>
